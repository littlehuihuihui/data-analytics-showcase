<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>展馆已迁移 · 正在跳转</title>
  <meta http-equiv="refresh" content="0; url=https://littlehuihuihui.github.io/data-analyst-gallery/" />
  <link rel="canonical" href="https://littlehuihuihui.github.io/data-analyst-gallery/" />
  <style>
    :root {
      --bg: #0b1220;
      --text: #e8eef7;
      --muted: #9aa8bc;
      --accent: #00d4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(1200px 600px at 50% -10%, #12304a 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    .card {
      max-width: 32rem;
      padding: 1.75rem 1.5rem;
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 14px;
      background: rgba(16, 24, 40, 0.85);
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.25rem; }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.6; font-size: 0.95rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      word-break: break-all;
    }
    a:hover { text-decoration: underline; }
    .btn {
      display: inline-block;
      margin-top: 0.25rem;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.45);
    }
  </style>
  <script>
    location.replace("https://littlehuihuihui.github.io/data-analyst-gallery/");
  </script>
</head>
<body>
  <div class="card">
    <h1>个人展馆已迁移到新地址</h1>
    <p>旧站 <code>data-analytics-showcase</code> 已停用。若未自动跳转，请点击下方链接进入新展馆（含广州纳诺等工作经历更新）。</p>
    <a class="btn" href="https://littlehuihuihui.github.io/data-analyst-gallery/">
      打开新站 data-analyst-gallery
    </a>
  </div>
</body>
</html>
